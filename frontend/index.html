<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232a78d6'/><path d='M8 11l8 6 8-6M8 11h16v11H8z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/></svg>" />
    <title>SecureMailScope</title>
    <script>
      // Apply the stored theme before first paint to avoid a light flash.
      try {
        const t = localStorage.getItem("sms-theme");
        const dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
